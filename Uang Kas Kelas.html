<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uang Kas Kelas</title>
<style>
  :root{
    --bg:#fff0f5; --card:#fff; --ink:#3b2a33; --muted:#9a8791; --line:#f6dde6;
    --primary:#ec4899; --primary-dark:#db2777; --primary-soft:#fff5f9; --green:#16a34a; --red:#e11d48;
    --shadow:0 4px 20px rgba(236,72,153,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter","Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  header{background:linear-gradient(135deg,#f9a8d4,#ec4899);color:#fff;padding:22px 18px 28px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(236,72,153,.25)}
  header h1{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.3px}
  header small{opacity:.9}
  header .class-name{background:rgba(255,255,255,.22);border:none;border-radius:10px;color:#fff;font:inherit;font-size:14px;width:200px;padding:6px 10px;outline:none;margin-bottom:6px}
  header .class-name::placeholder{color:#ffffffcc}
  header .back{background:rgba(255,255,255,.22);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;margin-bottom:10px;box-shadow:none}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:rgba(255,240,245,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1.5px solid transparent;background:#fff;color:var(--ink);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 2px 8px rgba(236,72,153,.08);transition:all .15s}
  .tab:hover{transform:translateY(-1px)}
  .tab.active{background:#fff;color:var(--primary-dark);border-color:var(--primary);font-weight:700;box-shadow:0 4px 14px rgba(236,72,153,.28)}
  .tab.recap{font-weight:600}
  main{max-width:760px;margin:0 auto;padding:6px 14px 30px}
  .card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .summary{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1 1 140px;background:linear-gradient(135deg,#fff5f9,#ffe4ee);border-radius:16px;padding:12px 14px}
  .stat span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .stat b{font-size:19px}
  .row{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:14px;transition:background .15s}
  .row:hover{background:var(--primary-soft)}
  .row:last-child{border-bottom:none}
  .no{width:26px;color:var(--muted);font-size:13px}
  .nm{flex:1;font-weight:500}
  .checks{color:var(--green);font-weight:700;letter-spacing:2px;font-size:18px}
  .rem{color:var(--primary);font-weight:600;font-size:14px}
  .tot{min-width:78px;text-align:right;font-size:13px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:20px}
  button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;font-weight:600;transition:transform .1s,box-shadow .15s}
  button:active{transform:scale(.97)}
  .btn{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff;box-shadow:0 4px 12px rgba(236,72,153,.3)}
  .btn.ghost{background:#fdeaf1;color:var(--primary-dark);box-shadow:none}
  .btn.danger{background:#ffe4e9;color:var(--red);box-shadow:none}
  input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(236,72,153,.15)}
  header .class-name:focus{box-shadow:none}
  textarea{min-height:110px}
  .modal-bg{position:fixed;inset:0;background:rgba(80,20,50,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(236,72,153,.3)}
  .modal h3{margin:0 0 4px}
  .modal .hint{font-size:12px;color:var(--muted);margin:6px 0 10px}
  .preview{margin:12px 0;padding:12px;background:linear-gradient(135deg,#fff5f9,#ffe4ee);border-radius:14px;text-align:center;min-height:46px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-size:12px;color:var(--muted);font-weight:600}
  tr.month{cursor:pointer}
  tr.month:hover{background:var(--primary-soft)}
  tr.month.open{background:var(--primary-soft)}
  tr.grand td{font-weight:700;border-top:2px solid var(--primary);border-bottom:none;color:var(--primary-dark)}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .note-form{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
  @media(min-width:560px){.note-form{grid-template-columns:2fr 1fr 1.2fr auto}}
  .note{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .note .n{flex:1}
  .note .del{background:none;color:var(--muted);padding:4px 8px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px}
  .badge.in{background:#dcfce7;color:var(--green)} .badge.out{background:#fee2e2;color:var(--red)}
  .tools{display:flex;gap:8px;flex-wrap:wrap}

  /* ===== Pencarian nama ===== */
  .searchbox{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:4px 10px 4px 14px;margin-bottom:14px;box-shadow:var(--shadow);border:1.5px solid transparent;transition:border-color .15s}
  .searchbox:focus-within{border-color:var(--primary)}
  .searchbox input{border:none;box-shadow:none !important;padding:10px 4px;background:transparent}
  .searchbox input::-webkit-search-cancel-button{display:none}
  .searchbox .sclear{background:#fdeaf1;color:var(--primary-dark);padding:4px 9px;border-radius:999px;font-size:12px;box-shadow:none}
  mark{background:#fbcfe8;color:inherit;border-radius:4px;padding:0 1px}

  /* ===== Halaman awal (daftar kelas) ===== */
  .home-title{margin:18px 4px 12px;font-size:15px;color:var(--muted);font-weight:500}
  .class-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:560px){.class-grid{grid-template-columns:1fr 1fr}}
  .class-card,.add-card{position:relative;min-height:130px;border-radius:22px;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .class-card{background:#fff;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;justify-content:space-between}
  .class-card:hover,.add-card:hover{transform:translateY(-3px)}
  .class-card h3{margin:0;font-size:19px;padding-right:56px;word-break:break-word}
  .class-card .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .class-card .saldo{font-size:20px;font-weight:700;color:var(--primary-dark)}
  .class-card .saldo small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .class-card .acts{position:absolute;top:12px;right:12px;display:flex;gap:4px}
  .class-card .acts button{background:#fdeaf1;padding:5px 9px;border-radius:10px;font-size:13px;box-shadow:none}
  .add-card{border:2.5px dashed #f5a9cb;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--primary);gap:4px}
  .add-card .plus{font-size:46px;line-height:1;font-weight:300}
  .add-card span{font-size:13px;font-weight:600}
</style>
</head>
<body>

<header id="header"></header>

<div class="tabs" id="tabs" style="display:none"></div>

<main id="main"></main>

<!-- Modal input pembayaran -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mName">Nama</h3>
    <div style="font-size:13px;color:var(--muted)" id="mMonth"></div>
    <div class="hint">Tulis jumlah, misal <b>5k</b>, <b>2000</b>, atau <b>1.5k</b>. 1 centang = Rp 2.000.</div>
    <input id="mInput" placeholder="contoh: 5k" inputmode="text" autocomplete="off">
    <div class="preview" id="mPreview"></div>
    <div class="actions">
      <button class="btn danger" id="mClear">Hapus</button>
      <button class="btn ghost" id="mCancel">Batal</button>
      <button class="btn" id="mSave">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal kelas (tambah / ubah nama) -->
<div class="modal-bg" id="classModalBg">
  <div class="modal">
    <h3 id="cmTitle">Tambah Kelas</h3>
    <div class="hint">Setiap kelas punya uang kas sendiri, jadi tidak akan tercampur.</div>
    <input id="cmInput" placeholder="contoh: XI IPA 1" autocomplete="off">
    <div class="actions">
      <button class="btn ghost" id="cmCancel">Batal</button>
      <button class="btn" id="cmSave">Simpan</button>
    </div>
  </div>
</div>

<script>
/* ====== PENGATURAN ====== */
const START_YEAR = 2026;          // Agustus START_YEAR s/d Juli START_YEAR+1
const CHECK_VALUE = 2000;         // nilai 1 centang
const STORAGE_KEY = 'uang-kas-kelas-v2';
const OLD_KEY = 'uang-kas-kelas-v1';

const BULAN = ['Agustus','September','Oktober','November','Desember','Januari','Februari','Maret','April','Mei','Juni','Juli'];
const bulanLabel = i => `${BULAN[i]} ${i < 5 ? START_YEAR : START_YEAR + 1}`;

/* ====== DATA ======
   db = { classes: [ { id, name, students:[{id,name}], pay:{bulan:{siswa:jumlah}}, notes:{bulan:[{id,name,amount,type}]} } ] }
*/
let db = load();
let data = null;        // kelas yang sedang dibuka
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(d && Array.isArray(d.classes)) return d;
  }catch(e){}
  // migrasi dari versi lama (satu kelas saja)
  try{
    const o = JSON.parse(localStorage.getItem(OLD_KEY));
    if(o && o.students && (o.students.length || Object.keys(o.pay||{}).length)){
      return { classes:[{ id:uid(), name:o.className || 'Kelas 1', students:o.students, pay:o.pay||{}, notes:o.notes||{} }] };
    }
  }catch(e){}
  return { classes:[] };
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){} }

/* ====== UTIL ====== */
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
function uid(){ return Math.random().toString(36).slice(2,9); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseAmount(str){
  str = String(str).trim().toLowerCase().replace(/rp/g,'').replace(/\s+/g,'');
  if(!str) return null;
  let m = str.match(/^([\d.,]+)(k|rb|ribu)$/);
  if(m){
    const v = parseFloat(m[1].replace(',', '.'));
    return isNaN(v) ? null : Math.round(v*1000);
  }
  m = str.match(/^[\d.,]+$/);
  if(m){
    const v = parseInt(str.replace(/[.,]/g,''),10);
    return isNaN(v) ? null : v;
  }
  return null;
}

function checkParts(amount){
  const c = Math.floor(amount / CHECK_VALUE);
  const r = amount - c*CHECK_VALUE;
  return {c, r};
}

function payTotal(mi, d = data){
  const p = d.pay[mi] || {};
  return Object.values(p).reduce((a,b)=>a+b,0);
}
function noteTotals(mi, d = data){
  const n = d.notes[mi] || [];
  let inn=0,out=0;
  n.forEach(x => x.type==='in' ? inn+=x.amount : out+=x.amount);
  return {inn,out};
}
function monthSummary(mi, d = data){
  const kas = payTotal(mi, d);
  const {inn,out} = noteTotals(mi, d);
  return {kas, inn, out, saldo: kas + inn - out};
}
function classSaldo(d){
  let s = 0;
  for(let i=0;i<12;i++) s += monthSummary(i,d).saldo;
  return s;
}

/* ====== STATE UI ====== */
let activeTab = 'm0';   // m0..m11 atau 'recap' atau 'siswa'
let openRecapMonth = null;
let searchQ = '';       // kata kunci pencarian nama siswa

function defaultMonthTab(){
  const now = new Date();
  const m = now.getMonth(), y = now.getFullYear();
  const idx = m >= 7 ? m-7 : m+5;
  const yr = m >= 7 ? y : y-1;
  return yr === START_YEAR ? 'm'+idx : 'm0';
}

/* ====== RENDER UTAMA ====== */
function render(){
  if(!data) renderHome();
  else renderClass();
}

/* ====== HALAMAN AWAL ====== */
function renderHome(){
  const header = document.getElementById('header');
  header.innerHTML = `<h1>💰 Uang Kas</h1><small>Pilih kelas atau tambah kelas baru</small>`;
  document.getElementById('tabs').style.display = 'none';

  const plusCount = Math.max(1, 2 - db.classes.length);
  const cards = db.classes.map(c=>{
    const stu = c.students.length;
    return `<div class="class-card" data-open="${c.id}">
      <div class="acts">
        <button data-edit="${c.id}" title="Ubah nama">✏️</button>
        <button data-del="${c.id}" title="Hapus kelas">🗑️</button>
      </div>
      <div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${stu} siswa</div>
      </div>
      <div class="saldo"><small>Total kas</small>${rp(classSaldo(c))}</div>
    </div>`;
  }).join('');
  const plus = Array.from({length:plusCount}).map(()=>
    `<div class="add-card" data-add="1"><div class="plus">+</div><span>Tambah kelas</span></div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="home-title">${db.classes.length ? 'Kelas kamu' : 'Belum ada kelas. Klik + untuk mulai.'}</div>
    <div class="class-grid">${cards}${plus}</div>
    <div class="card tools" style="margin-top:20px">
      <button class="btn ghost" id="btnExport">⬇️ Backup semua data</button>
      <button class="btn ghost" id="btnImport">⬆️ Restore data</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>`;

  const main = document.getElementById('main');
  main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openClass(el.dataset.open));
  main.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>openClassModal(null));
  main.querySelectorAll('[data-edit]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openClassModal(el.dataset.edit); });
  main.querySelectorAll('[data-del]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const c = db.classes.find(x=>x.id===el.dataset.del);
    if(confirm(`Hapus kelas "${c.name}" beserta semua datanya? Ini tidak bisa dibatalkan.`)){
      db.classes = db.classes.filter(x=>x.id!==c.id);
      save(); render();
    }
  });
  document.getElementById('btnExport').onclick = exportData;
  document.getElementById('btnImport').onclick = ()=>document.getElementById('fileImport').click();
  document.getElementById('fileImport').onchange = importData;
}

function openClass(id){
  data = db.classes.find(c=>c.id===id);
  activeTab = defaultMonthTab();
  openRecapMonth = null;
  searchQ = '';
  window.scrollTo(0,0);
  render();
}
function backHome(){
  data = null;
  window.scrollTo(0,0);
  render();
}

/* ====== MODAL KELAS ====== */
const cBg = document.getElementById('classModalBg');
const cInp = document.getElementById('cmInput');
let editingClass = null;
function openClassModal(id){
  editingClass = id;
  const c = id ? db.classes.find(x=>x.id===id) : null;
  document.getElementById('cmTitle').textContent = c ? 'Ubah Nama Kelas' : 'Tambah Kelas';
  cInp.value = c ? c.name : '';
  cBg.classList.add('show');
  setTimeout(()=>cInp.focus(),50);
}
function closeClassModal(){ cBg.classList.remove('show'); editingClass = null; }
document.getElementById('cmCancel').onclick = closeClassModal;
cBg.onclick = e => { if(e.target===cBg) closeClassModal(); };
cInp.onkeydown = e => { if(e.key==='Enter') document.getElementById('cmSave').click(); };
document.getElementById('cmSave').onclick = ()=>{
  const name = cInp.value.trim();
  if(!name){ alert('Isi nama kelas dulu ya'); return; }
  if(editingClass){
    db.classes.find(x=>x.id===editingClass).name = name;
    save(); closeClassModal(); render();
  } else {
    const c = { id:uid(), name, students:[], pay:{}, notes:{} };
    db.classes.push(c);
    save(); closeClassModal();
    openClass(c.id);
    activeTab = 'siswa'; render();   // langsung isi daftar siswa
  }
};

/* ====== HALAMAN KELAS ====== */
function renderClass(){
  document.getElementById('header').innerHTML = `
    <button class="back" id="btnBack">← Semua kelas</button>
    <h1>💰 ${esc(data.name)}</h1>
    <div><small>Periode Agustus ${START_YEAR} – Juli ${START_YEAR+1}</small></div>`;
  document.getElementById('btnBack').onclick = backHome;
  renderTabs();
  if(activeTab==='recap') renderRecap();
  else if(activeTab==='siswa') renderStudents();
  else renderMonth(parseInt(activeTab.slice(1)));
}

function renderTabs(){
  const t = document.getElementById('tabs');
  t.style.display = 'flex';
  t.innerHTML = BULAN.map((b,i)=>`<div class="tab ${activeTab==='m'+i?'active':''}" data-tab="m${i}">${b.slice(0,3)}</div>`).join('')
    + `<div class="tab recap ${activeTab==='recap'?'active':''}" data-tab="recap">📊 Recap</div>`
    + `<div class="tab ${activeTab==='siswa'?'active':''}" data-tab="siswa">👥 Siswa</div>`;
  t.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
    activeTab = el.dataset.tab; renderClass();
    const act = document.querySelector('.tab.active');
    if(act) act.scrollIntoView({inline:'center',block:'nearest'});
  });
  const act = t.querySelector('.tab.active');
  if(act) t.scrollLeft = act.offsetLeft - t.clientWidth/2 + act.clientWidth/2;
}

function renderMonth(mi){
  const main = document.getElementById('main');
  const pay = data.pay[mi] || {};
  const paid = data.students.filter(s => pay[s.id] > 0).length;
  const total = payTotal(mi);

  let html = `<div class="card"><h2 style="margin:0 0 10px">${bulanLabel(mi)}</h2>
    <div class="summary">
      <div class="stat"><span>Terkumpul bulan ini</span><b>${rp(total)}</b></div>
      <div class="stat"><span>Sudah bayar</span><b>${paid} / ${data.students.length}</b></div>
    </div></div>`;

  if(!data.students.length){
    html += `<div class="card empty">Belum ada siswa.<br><br><button class="btn" onclick="activeTab='siswa';renderClass()">Tambah daftar siswa</button></div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="searchbox">
      <span>🔍</span>
      <input id="searchInput" type="search" placeholder="Cari nama siswa..." autocomplete="off" value="${esc(searchQ)}">
      <button id="searchClear" class="sclear" style="display:${searchQ?'block':'none'}">✕</button>
    </div>
    <div class="card" id="studentList"></div>`;
  main.innerHTML = html;

  const listEl = document.getElementById('studentList');
  const sInp = document.getElementById('searchInput');
  const sClr = document.getElementById('searchClear');

  function drawList(){
    const q = searchQ.trim().toLowerCase();
    const rows = data.students
      .map((s,i)=>({s,i}))
      .filter(x => !q || x.s.name.toLowerCase().includes(q));
    if(!rows.length){
      listEl.innerHTML = `<div class="empty">Tidak ada nama yang cocok dengan "<b>${esc(searchQ.trim())}</b>"</div>`;
      return;
    }
    listEl.innerHTML = rows.map(({s,i})=>{
      const a = pay[s.id] || 0;
      const {c,r} = checkParts(a);
      let nameHtml = esc(s.name);
      if(q){
        const idx = s.name.toLowerCase().indexOf(q);
        nameHtml = esc(s.name.slice(0,idx)) + '<mark>' + esc(s.name.slice(idx, idx+q.length)) + '</mark>' + esc(s.name.slice(idx+q.length));
      }
      return `<div class="row" data-id="${s.id}">
        <div class="no">${i+1}</div>
        <div class="nm">${nameHtml}</div>
        <div class="checks">${'✓'.repeat(c)}</div>
        <div class="rem">${r? r : ''}</div>
        <div class="tot">${a? rp(a) : '<span style="opacity:.4">—</span>'}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.row').forEach(el=>el.onclick=()=>openModal(mi, el.dataset.id));
  }
  drawList();

  sInp.oninput = ()=>{
    searchQ = sInp.value;
    sClr.style.display = searchQ ? 'block' : 'none';
    drawList();
  };
  sClr.onclick = ()=>{ searchQ = ''; sInp.value = ''; sClr.style.display = 'none'; drawList(); sInp.focus(); };
}

function renderRecap(){
  const main = document.getElementById('main');
  let g = {kas:0,inn:0,out:0,saldo:0};
  let rows = BULAN.map((_,i)=>{
    const s = monthSummary(i);
    g.kas+=s.kas; g.inn+=s.inn; g.out+=s.out; g.saldo+=s.saldo;
    const open = openRecapMonth===i;
    return `<tr class="month ${open?'open':''}" data-m="${i}">
      <td>${open?'▾':'▸'} ${bulanLabel(i)}</td>
      <td>${rp(s.kas)}</td>
      <td class="pos">${s.inn? '+'+rp(s.inn):'-'}</td>
      <td class="neg">${s.out? '-'+rp(s.out):'-'}</td>
      <td><b>${rp(s.saldo)}</b></td>
    </tr>` + (open ? `<tr><td colspan="5" style="text-align:left;background:#fff9fb">${notesPanel(i)}</td></tr>` : '');
  }).join('');

  main.innerHTML = `
    <div class="card">
      <div class="summary">
        <div class="stat"><span>Total seluruh kas</span><b class="${g.saldo<0?'neg':''}">${rp(g.saldo)}</b></div>
        <div class="stat"><span>Kas masuk (iuran)</span><b>${rp(g.kas)}</b></div>
        <div class="stat"><span>Penambahan</span><b class="pos">${rp(g.inn)}</b></div>
        <div class="stat"><span>Pengeluaran</span><b class="neg">${rp(g.out)}</b></div>
      </div>
    </div>
    <div class="card" style="overflow-x:auto">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Klik nama bulan untuk melihat / menulis catatan pengeluaran atau penambahan.</div>
      <table>
        <thead><tr><th>Bulan</th><th>Iuran</th><th>Tambah</th><th>Keluar</th><th>Saldo</th></tr></thead>
        <tbody>${rows}
          <tr class="grand"><td>TOTAL</td><td>${rp(g.kas)}</td><td class="pos">${rp(g.inn)}</td><td class="neg">${rp(g.out)}</td><td>${rp(g.saldo)}</td></tr>
        </tbody>
      </table>
    </div>`;

  main.querySelectorAll('tr.month').forEach(tr=>tr.onclick=()=>{
    const i = parseInt(tr.dataset.m);
    openRecapMonth = openRecapMonth===i ? null : i;
    renderRecap();
  });
  bindNotes();
}

function notesPanel(mi){
  const list = data.notes[mi] || [];
  const {inn,out} = noteTotals(mi);
  return `<div data-notes="${mi}">
    <b>Catatan ${bulanLabel(mi)}</b>
    <div class="note-form">
      <input class="nn" placeholder="Nama (mis. Beli spidol)">
      <input class="na" placeholder="Jumlah (mis. 15k)">
      <select class="nt"><option value="out">Pengeluaran</option><option value="in">Penambahan</option></select>
      <button class="btn nadd">Tambah</button>
    </div>
    ${list.length ? list.map(x=>`
      <div class="note">
        <span class="badge ${x.type}">${x.type==='in'?'Tambah':'Keluar'}</span>
        <div class="n">${esc(x.name)}</div>
        <b class="${x.type==='in'?'pos':'neg'}">${x.type==='in'?'+':'-'}${rp(x.amount)}</b>
        <button class="del" data-del="${x.id}">✕</button>
      </div>`).join('') : '<div style="color:var(--muted);padding:8px 0">Belum ada catatan.</div>'}
    <div style="margin-top:8px;font-size:13px;color:var(--muted)">Total tambahan: <b class="pos">${rp(inn)}</b> · Total pengeluaran: <b class="neg">${rp(out)}</b></div>
  </div>`;
}

function bindNotes(){
  document.querySelectorAll('[data-notes]').forEach(box=>{
    const mi = parseInt(box.dataset.notes);
    box.onclick = e => e.stopPropagation();
    box.querySelector('.nadd').onclick = ()=>{
      const name = box.querySelector('.nn').value.trim();
      const amt = parseAmount(box.querySelector('.na').value);
      const type = box.querySelector('.nt').value;
      if(!name){ alert('Isi nama dulu ya'); return; }
      if(amt===null || amt<=0){ alert('Jumlah tidak valid. Contoh: 15k atau 15000'); return; }
      (data.notes[mi] = data.notes[mi] || []).push({id:uid(), name, amount:amt, type});
      save(); renderRecap();
    };
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      data.notes[mi] = (data.notes[mi]||[]).filter(x=>x.id!==b.dataset.del);
      save(); renderRecap();
    });
  });
}

function renderStudents(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">Daftar Siswa</h2>
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Tulis satu nama per baris. Menghapus nama juga menghapus riwayat bayarnya.</div>
      <textarea id="names" style="min-height:260px">${esc(data.students.map(s=>s.name).join('\n'))}</textarea>
      <div style="margin-top:10px"><button class="btn" id="saveNames">Simpan daftar</button></div>
    </div>`;
  document.getElementById('saveNames').onclick = ()=>{
    const names = document.getElementById('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const old = [...data.students];
    const used = new Set();
    const next = names.map(n=>{
      const found = old.find(o=>o.name===n && !used.has(o.id));
      if(found){ used.add(found.id); return found; }
      return {id:uid(), name:n};
    });
    const keep = new Set(next.map(s=>s.id));
    Object.keys(data.pay).forEach(m=>{
      Object.keys(data.pay[m]).forEach(id=>{ if(!keep.has(id)) delete data.pay[m][id]; });
    });
    data.students = next;
    save();
    activeTab = defaultMonthTab(); renderClass();
  };
}

/* ====== MODAL PEMBAYARAN ====== */
let cur = null;
const bg = document.getElementById('modalBg');
const inp = document.getElementById('mInput');
function openModal(mi, sid){
  const s = data.students.find(x=>x.id===sid);
  cur = {mi, sid};
  document.getElementById('mName').textContent = s.name;
  document.getElementById('mMonth').textContent = bulanLabel(mi);
  const a = (data.pay[mi]||{})[sid];
  inp.value = a ? a : '';
  updatePreview();
  bg.classList.add('show');
  setTimeout(()=>inp.focus(),50);
}
function closeModal(){ bg.classList.remove('show'); cur=null; }
function updatePreview(){
  const v = parseAmount(inp.value);
  const el = document.getElementById('mPreview');
  if(inp.value.trim()==='' ) { el.innerHTML = '<span style="color:var(--muted)">Belum ada jumlah</span>'; return; }
  if(v===null){ el.innerHTML = '<span class="neg">Format tidak dikenali</span>'; return; }
  const {c,r} = checkParts(v);
  el.innerHTML = `<span class="checks">${'✓'.repeat(c)}</span> <span class="rem">${r||''}</span><div style="font-size:13px;color:var(--muted)">${rp(v)}</div>`;
}
inp.oninput = updatePreview;
inp.onkeydown = e => { if(e.key==='Enter') document.getElementById('mSave').click(); };
document.getElementById('mCancel').onclick = closeModal;
bg.onclick = e => { if(e.target===bg) closeModal(); };
document.getElementById('mClear').onclick = ()=>{
  if(data.pay[cur.mi]) delete data.pay[cur.mi][cur.sid];
  save(); closeModal(); renderClass();
};
document.getElementById('mSave').onclick = ()=>{
  const v = parseAmount(inp.value);
  if(inp.value.trim()===''){ document.getElementById('mClear').click(); return; }
  if(v===null){ alert('Format tidak dikenali. Contoh: 5k, 2000, 1.5k'); return; }
  (data.pay[cur.mi] = data.pay[cur.mi] || {})[cur.sid] = v;
  save(); closeModal(); renderClass();
};

/* ====== BACKUP ====== */
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup-uang-kas.json';
  a.click();
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      let d = JSON.parse(r.result);
      if(d && d.students && d.pay){           // backup dari versi lama (satu kelas)
        d = { classes:[{ id:uid(), name:d.className || 'Kelas 1', students:d.students, pay:d.pay, notes:d.notes||{} }] };
      }
      if(!d || !Array.isArray(d.classes)) throw 0;
      if(db.classes.length && !confirm('Data yang ada sekarang akan diganti dengan isi backup. Lanjut?')) return;
      db = d; save(); data = null; render(); alert('Data berhasil dipulihkan');
    }catch(err){ alert('File backup tidak valid'); }
  };
  r.readAsText(f);
}

render();
</script>
</body>
